<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ledger</title><link rel="stylesheet" href="/shared.css">
<style>
body { display: grid; place-items: center; min-height: 100vh; }
main { max-width: 640px; padding: 32px; }
h1 { font-family: var(--mono); font-size: 44px; margin: 0 0 6px; }
p.tag { color: var(--text-2); margin: 0 0 28px; font-size: 18px; }
.links a { display: block; padding: 16px 18px; margin: 10px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); text-decoration: none; }
.links a:hover { border-color: var(--twitch); }
.links small { display: block; color: var(--text-2); margin-top: 4px; }
#mode { font-family: var(--mono); color: var(--text-2); font-size: 13px; margin-top: 24px; }
</style></head><body>
<main>
  <h1>Ledger</h1>
  <p class="tag">Chat keeps the receipts.</p>
  <div class="links">
    <a href="/overlay">Overlay <small>Add as an OBS browser source, 1920×1080, transparent.</small></a>
    <a href="/panel">Streamer panel <small>Connect Twitch, start the mic, approve or settle IOUs.</small></a>
    <a href="/ledger">Public ledger <small>What the streamer owes, paid, and welched. Share this.</small></a>
  </div>
  <div id="mode"></div>
</main>
<script>
fetch('/api/state').then(r => r.json()).then(s => {
  document.getElementById('mode').textContent = `mode: ${s.mode} · channel: ${s.channel} · ${s.state.ious.length} IOUs on file`;
});
</script>
</body></html>
